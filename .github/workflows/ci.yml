name: Isolated checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: Isolated regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify version and repository hygiene
        run: python scripts/verify_release.py
      - name: Python regression (isolated fake services only)
        run: python -m unittest discover -s tests -v
      - name: Node regression (no real App or business task)
        run: node --test tests/test_ui.cjs
      - name: Compile Python modules
        run: python -m compileall -q codex_resume
      - name: Check browser JavaScript syntax
        run: node --check codex_resume/static/app.js

  release:
    name: Publish source release
    needs: regression
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate tag and prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from codex_resume import __version__

          tag = os.environ['RELEASE_TAG']
          if tag != 'v' + __version__:
              raise SystemExit('Version tag does not match package version')
          sections = Path('CHANGELOG.md').read_text(encoding='utf-8').split('\n## ')
          notes = next((section for section in sections[1:]
                        if section.startswith(__version__ + ' — ')), None)
          if notes is None:
              raise SystemExit('Missing changelog entry for release')
          Path('release-notes.md').write_text('## ' + notes, encoding='utf-8')
          PY
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
